name: release

# A release is a decision about which upstream tag to ship, not a side effect of
# a merge: the tree is generated from vendor/, so publishing is deliberate and
# tag-triggered. npm is the only registry involved — pi and omp both install from
# npm and read the manifest out of the published tarball, so one publish serves
# all three. pi.dev and omp.sh render their listings from npm metadata; there is
# nothing to publish to them.
on:
  push:
    tags: ["v*"]

# Read-only by default. The publish job elevates itself to `id-token: write`,
# which is the only permission trusted publishing needs.
permissions:
  contents: read

# One run per tag, and never cancelled. The group is per ref because GitHub
# keeps only one *pending* run per group and cancels the older one even with
# cancel-in-progress: false, so a shared group would let a third tag pushed
# close behind cancel the middle tag's release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything cheap, in the order that fails fastest. A mistagged release dies
  # on the version check before the suite below spends a runner on it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Active LTS. Node 24 bundles npm 11.x, which clears the floor for
          # trusted publishing (npm >= 11.5.1, Node >= 22.14.0).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install build dependencies
        run: npm ci

      # Reproduces the committed tree from the pinned upstream tag. This is the
      # only place the checksum in vendor/lock.json is verified: vendor/ is
      # gitignored, so a bad pin never reaches review.
      - name: Vendor and sync
        run: |
          node tools/vendor.mjs
          node tools/sync.mjs

      # The version is `<upstream>-pi.N`: sync.mjs takes the upstream part from
      # the vendored plugin.json and keeps the port revision N a maintainer set
      # with `npm version prerelease --preid pi`. A tag that disagrees would
      # publish a version nobody tagged, or fail as a duplicate after the tag is
      # already public and immutable.
      - name: Assert the tag matches package.json
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(npm pkg get version | tr -d '"')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
          echo "releasing $version"

      - name: Verify structure
        run: node tools/verify.mjs

      - name: Unit tests
        run: node --test 'tests/*.test.mjs'

      - name: Scan for credential-shaped strings
        run: node tools/scan-secrets.mjs

      # The generated tree is committed so a git-source install works without a
      # build step. If sync produced a different tree than the one committed, the
      # tarball would not match the tag it claims to be.
      - name: Assert the committed tree matches the sync output
        run: |
          # `git diff` ignores untracked files, so a file sync newly emitted (a
          # skill an upstream bump added) would pass it while missing from git.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated tree is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

  # The vendored upstream suite, run against the tree about to be published. It
  # exercises the SSRF guard, the schema validator, the fetchers and the cost
  # ledgers — the runtime behaviour `verify` cannot see. It is the last gate
  # before an irreversible publish.
  upstream-suite:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: npm ci

      # The suite imports the runtime's own packages (requests, bs4, lxml,
      # google-auth, ...), so it installs them from the same requirements.txt
      # the managed runtime uses, at the same version bounds.
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            pytest -r requirements.txt

      - name: Vendor and sync
        run: |
          node tools/vendor.mjs
          node tools/sync.mjs

      - name: Run the upstream suite against the shipped tree
        env:
          CLAUDE_SEO_PYTHON: python3
        run: node tools/upstream-tests.mjs

  # The whole CI workflow, run at the tagged commit. The extension typecheck,
  # the Python 3.10-3.14 runtime matrix and the tarball checks live only there,
  # and a tag can name a commit CI never ran on, or ran on and failed.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [verify, upstream-suite, ci]
    runs-on: ubuntu-latest
    # A tag push alone must not publish: this environment carries a required
    # reviewer (repository Settings > Environments), so the job pauses until a
    # maintainer approves it. If npm's trusted-publisher entry names an
    # environment, it has to be this one.
    environment: npm-release
    # Trusted publishing exchanges this OIDC token for a short-lived publish
    # credential, so no NPM_TOKEN is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds: a restored cache is a build
          # input an attacker can poison, and the tarball it produced would still
          # carry a valid provenance attestation for the wrong bytes.
          package-manager-cache: false

      - name: Install build dependencies
        run: npm ci

      # Each job gets a fresh checkout, so the generated tree is rebuilt here.
      # `verify` already asserted the committed tree equals this output, so the
      # bytes published are the bytes that passed the gates above.
      - name: Vendor and sync
        run: |
          node tools/vendor.mjs
          node tools/sync.mjs

      # No token: npm detects the OIDC environment and exchanges the GitHub
      # token for a short-lived publish credential. Provenance is generated
      # automatically under trusted publishing; the flag is passed anyway so the
      # supply-chain property fails loudly rather than regressing silently. It is
      # deliberately absent from publishConfig, which would force provenance on
      # every local publish too and break the one-time bootstrap release.
      #
      # `--tag latest` is required: every version is a `-pi.N` prerelease, and
      # npm 11 refuses to publish a prerelease without an explicit dist-tag.
      # Without `latest`, a plain install would never see it.
      - name: Publish
        run: npm publish --provenance --tag latest
